name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "task/**"]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Code generation
        run: |
          if grep -q 'build_runner' pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
