name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["task/**"]

jobs:
  analyze_and_test:
    if: hashFiles('pubspec.yaml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Code generation
        run: |
          if grep -q 'build_runner' pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  docs_only:
    if: hashFiles('pubspec.yaml') == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Flutter project yet
        run: echo "Skipping Flutter CI until pubspec.yaml exists (E0-T1)."
